name: serenay_ecommerce_widgets
description: >-
  Server-driven UI for Flutter e-commerce apps: render home and category
  screens (banners, product carousels, grids, flash sales, stories) from
  backend JSON.
version: 1.5.0
homepage: https://github.com/serenayyazilim/serenay-ecommerce-widgets
repository: https://github.com/serenayyazilim/serenay-ecommerce-widgets
topics:
  - server-driven-ui
  - ecommerce
  - json-ui
  - dynamic-ui
  - widgets

environment:
  sdk: ^3.10.3
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

  # Cupertino-style icons used by the widget catalog.
  cupertino_icons: ^1.0.9

  # Opens external links (LINK action, YOUTUBE tap-through, FASTREGISTER's
  # WhatsApp deep link).
  url_launcher: ^6.3.2

  # Backs the autoplaying, looping, silent VIDEOLIST slider.
  video_player: ^2.13.0

  # Backs the inline, autoplaying, muted, looping YOUTUBE embed.
  youtube_player_flutter: ^10.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
