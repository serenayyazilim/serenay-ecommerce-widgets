name: mobile_ecommerce_widgets
description: >-
  A backend-driven dynamic widget system for e-commerce home/category
  screens. Renders TEXT, IMAGE, CAROUSEL, GRID, PRODUCTCARD, FLASHSALE and
  more from a JSON payload, with navigation/data/cart injected by the host
  app.
version: 1.0.0
topics:
  - widgets
  - ecommerce
  - ui

environment:
  sdk: ^3.10.3
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

  # Cupertino-style icons used by the widget catalog.
  cupertino_icons: ^1.0.8

  # Opens external links (LINK action, YOUTUBE tap-through, FASTREGISTER's
  # WhatsApp deep link).
  url_launcher: ^6.3.1

  # Backs the autoplaying, looping, silent VIDEOLIST slider.
  video_player: ^2.9.2

  # Backs the inline, autoplaying, muted, looping YOUTUBE embed.
  youtube_player_flutter: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
