name: Deploy web demo + docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9

      - name: Install Flutter dependencies
        working-directory: example
        run: flutter pub get

      - name: Build web demo
        working-directory: example
        run: flutter build web --release --base-href /serenay-ecommerce-widgets/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install mkdocs
        run: pip install mkdocs mkdocs-material

      - name: Build docs
        run: mkdocs build --strict

      - name: Assemble Pages site
        run: |
          mkdir -p public
          cp -r example/build/web/. public/
          mkdir -p public/docs
          cp -r site/docs/. public/docs/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
