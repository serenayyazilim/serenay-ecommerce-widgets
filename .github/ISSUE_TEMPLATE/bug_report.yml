name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal `params`/JSON payload and code that triggers the issue, if applicable.
      render: dart
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 1.2.0
    validations:
      required: true

  - type: input
    id: flutter-version
    attributes:
      label: Flutter version
      placeholder: run `flutter --version`
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - macOS
        - Windows
        - Linux
    validations:
      required: false
